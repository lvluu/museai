<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>post-approve</title>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --fg: #1f2328; --muted: #6b7280; --line: #dfe1e6;
            --ok: #1a7f37; --bad: #cf222e; --primary: #cc0000; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d2125; --card: #22272b; --fg: #d6dde4; --muted: #8c9bab; --line: #38414a;
              --ok: #4bce97; --bad: #f87462; --primary: #ff4e45; }
    }
    body { margin: 0; width: 520px; max-height: 590px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 12px; display: flex;
             flex-wrap: wrap; align-items: center; gap: 6px 10px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 14px; margin: 0; flex: 1 1 auto; white-space: nowrap; }
    header .bar { flex: 1 1 100%; display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
    header .bar select { width: auto; min-width: 0; flex: 1 1 120px; max-width: 200px; text-overflow: ellipsis; }
    header .bar button { white-space: nowrap; padding: 4px 10px; flex: none; }
    header .bar .check { white-space: nowrap; flex: none; }
    header .bar #all { margin-left: auto; }
    select { appearance: auto; cursor: pointer; }
    select option { background: var(--card); color: var(--fg); }
    main { padding: 8px 12px; display: grid; gap: 8px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; }
    .top { display: flex; gap: 10px; }
    video { width: 120px; height: 160px; object-fit: cover; background: #000; border-radius: 6px; flex: none; }
    .fields { flex: 1; display: grid; gap: 6px; align-content: start; }
    .meta { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .pill { background: var(--primary); color: #fff; border-radius: 10px; padding: 0 8px; font-weight: 600; }
    .pill.dry { background: var(--muted); }
    label { font-size: 11px; color: var(--muted); display: grid; gap: 2px; }
    input, textarea, select { font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
                              border-radius: 4px; padding: 4px 6px; box-sizing: border-box; width: 100%; }
    textarea { min-height: 56px; resize: vertical; }
    .count { float: right; }
    .count.over { color: var(--bad); }
    .row { display: flex; gap: 8px; align-items: center; }
    .row label { flex: 1; }
    .check { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--fg); }
    .check input { width: auto; }
    button { font: inherit; padding: 5px 14px; border-radius: 4px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); cursor: pointer; }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button:disabled { opacity: .5; cursor: default; }
    .status { font-size: 12px; word-break: break-word; }
    .status.ok { color: var(--ok); } .status.bad { color: var(--bad); }
    .status a { color: inherit; }
    .card[data-state=queued] { border-left: 4px solid var(--ok); }
    .card[data-state=posting] { border-left: 4px solid var(--primary); }
    .card[data-state=done] { border-left: 4px solid var(--ok); opacity: .7; }
    .card[data-state=failed] { border-left: 4px solid var(--bad); }
    .pill.state { background: var(--ok); }
    .card[data-state=posting] .pill.state { background: var(--primary); }
    #sum { font-size: 12px; color: var(--muted); }
    .empty { color: var(--muted); text-align: center; padding: 40px 16px; }
    #dupbox { padding: 8px 12px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
    [hidden] { display: none !important; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border-radius: 16px; padding: 6px 12px; }
    .chip.on, #dups.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    #duplist { display: grid; gap: 6px; }
    .dup { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 4px; }
    .dup.gone { opacity: .55; }
    .dtop { display: flex; gap: 8px; align-items: center; }
    .dtop img { width: 64px; height: 48px; object-fit: cover; border-radius: 4px; background: #000; flex: none; }
    .dinfo { flex: 1; min-width: 0; display: grid; gap: 2px; }
    .dinfo b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dup a { color: inherit; }
    button.danger { border-color: var(--bad); color: var(--bad); flex: none; padding: 8px 14px; }
    .dupall { display: flex; justify-content: flex-end; }
    button.danger.armed { background: var(--bad); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Pending posts</h1>
    <span id="sum"></span>
    <div class="bar">
      <select id="chan" title="Show one channel only; Approve all then applies to it"><option value="">All channels</option></select>
      <button id="dups">Duplicates</button>
      <label class="check"><input type="checkbox" id="hide"> hide approved</label>
      <button id="all" class="primary" title="Enter = approve all">Approve all</button>
    </div>
  </header>
  <section id="dupbox" hidden>
    <div id="dupch" class="chips"></div>
    <div class="status" id="dupst"></div>
    <div id="duplist"></div>
  </section>
  <main id="list"></main>
  <script src="panel.js"></script>
</body>
</html>
